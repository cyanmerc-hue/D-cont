<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Documents</title>
  <link rel="stylesheet" href="/static/app.css?v=" />
</head>
<body style="padding:16px;">
  <h2>Documents</h2>

  {% if not docs %}
    <p>No documents found.</p>
  {% endif %}

  {% for d in docs %}
    <div class="card-pro" style="padding:12px; margin:12px 0;">
      <div><b>{{ d.doc_type }}</b> • {{ d.status }}</div>
      <div class="muted" style="font-size:12px;">User: {{ d.user_id }}</div>
      <div class="muted" style="font-size:12px;">File: {{ d.original_name }}</div>

      <div style="margin-top:10px;">
        <a class="btn btn-secondary btn-sm" href="/owner/docs/{{ d.id }}/download">Download</a>
      </div>

      <form method="POST" action="/owner/docs/{{ d.id }}/status" style="margin-top:10px;">
        <select name="status" class="input" style="max-width:220px;">
          <option value="pending"  {% if d.status=='pending' %}selected{% endif %}>Pending</option>
          <option value="verified" {% if d.status=='verified' %}selected{% endif %}>Verified</option>
          <option value="rejected" {% if d.status=='rejected' %}selected{% endif %}>Rejected</option>
        </select>
        <input name="admin_note" class="input" placeholder="Admin note (optional)" value="{{ d.admin_note or '' }}" />
        <button class="btn btn-sm" type="submit" style="margin-top:8px;">Save</button>
      </form>
    </div>
  {% endfor %}
</body>
</html>
